<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Investimentos</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="h-[100dvh] grid grid-cols-3 grid-rows-2">
    <aside 
        class="bg-green-100 row-span-2 flex flex-col justify-between py-5 px-2">
      <h1 class="text-2xl font-bold px-6">Calculadora de Investimentos</h1>
      <form id="investiment-form" class="w-full">

        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label class="font-bold text-gray-700" 
                 for="starting-amount">Investimento inicial</label>
          <div class="flex">
            <input 
              class="w-1/6 text-center rounded-l-lg bg-green-200" 
              type="text" 
              value="R$" 
              disabled />
            <input 
              class="w-5/6 bg-white rounded-r-lg px-2" 
              type="text" 
              placeholder="0.00"
              id="starting-amount" 
              name="starting-amount" 
              required/>        
          </div>
        </div>


        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label class="font-bold text-gray-700" 
                 for="additional-contribution">Aportes adicionais</label>
          <div class="flex">
            <input class="w-1/6 text-center rounded-l-lg bg-green-200" type="text" value="R$" disabled>
            <input 
              class="w-5/6 bg-white rounded-r-lg px-2" 
              type="text" 
              placeholder="0.00"
              id="additional-contribution" 
              name="additional-contribution" 
              >        
          </div>
        </div>

        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label class="font-bold text-gray-700" 
                 for="time-amount">Prazo</label>
          <div class="flex">
            <input 
              class="w-2/3 rounded-l-lg bg-white px-2" 
              type="text" 
              placeholder="0"
              id="time-amount" 
              name="time-amount" 
              required>        
            <select  
                id="time-amount-period" 
                name="time-amount-period" 
                class="w-1/3 
                       rounded-r-lg 
                       border-1-2 
                       border-amerald-600 
                       text-center 
                       hover:bg-emerald-950
                       hover:text-slate-200">
                <option value="monthly">Mensal</option>
                <option  value="annual">Anual</option>
            </select>
          </div>
        </div>


        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label class="font-bold text-gray-700" 
                 for="return-rate">Rentabilidade</label>
          <div class="flex">
            <input class="w-1/6 text-center rounded-l-lg bg-green-200" type="text" value="%" disabled>
            <input 
              class="w-1/2 bg-white px-2" 
              type="text" 
              placeholder="0"
              id="return-rate" 
              name="return-rate" 
              required>        
            <select  
                id="evaluation-period" 
                name="evaluation-period" 
                class="w-1/3 
                       rounded-r-lg 
                       border-1-2 
                       border-amerald-600 
                       text-center 
                       hover:bg-emerald-950
                       hover:text-slate-200">
                <option value="monthly">Mensal</option>
                <option  value="annual">Anual</option>
            </select>
          </div>
        </div>

        <div class="flex w-full flex-col px-6 my-2 h-[4.25rem]">
          <label class="font-bold text-gray-700" 
                 for="tax-rate">Impostos sobre lucro</label>
          <div class="flex">
            <input class="w-1/6 text-center rounded-l-lg bg-green-200" type="text" value="%" disabled>
            <input 
              class="w-5/6 bg-white rounded-r-lg px-2" 
              type="text" 
              placeholder="0"
              id="tax-rate" 
              name="tax-rate" 
              required>        

          </div>
        </div>

      </form>
        <div class="flex h-12 px-6 my-8 w-full gap-2">
          <button id="calculate-results" 
                  name="calculate-results"
                  class="w-1/2 rounded-lg bg-emerald-950 text-slate-200 hover:bg-emerald-800"
                  form="investiment-form"
                  type="submit">Calcular</button>
          <button id="clearForm" class="w-1/2 rounded-lg hover:bg-emerald-500">Limpar</button>
        </div>
    </aside>
    <main>
      <p>Resultados</p>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
